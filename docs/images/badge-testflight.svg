<svg xmlns="http://www.w3.org/2000/svg" width="212" height="56" viewBox="0 0 212 56" role="img" aria-label="Join the beta on TestFlight">
  <title>Join the beta on TestFlight</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c3ff"/>
      <stop offset="0.55" stop-color="#1e7bf2"/>
      <stop offset="1" stop-color="#1a4fd6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="blade" d="M0 -2.6 C 4.6 -4.4 6.6 -10.2 3.4 -15.6 C 1.9 -18.1 -1.9 -18.1 -3.4 -15.6 C -6.6 -10.2 -4.6 -4.4 0 -2.6 Z"/>
  </defs>
  <rect width="212" height="56" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="211" height="55" rx="13.5" fill="url(#shine)" stroke="#ffffff" stroke-opacity="0.25"/>
  <!-- propeller -->
  <g transform="translate(34 28)">
    <circle r="21" fill="#ffffff" fill-opacity="0.14"/>
    <circle r="21" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 4.33" stroke-linecap="round"/>
    <g fill="#ffffff" transform="rotate(18)">
      <use href="#blade"/>
      <use href="#blade" transform="rotate(120)"/>
      <use href="#blade" transform="rotate(240)"/>
    </g>
    <circle r="3.4" fill="#1e7bf2" stroke="#ffffff" stroke-width="1.6"/>
  </g>
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
    <text x="66" y="23" font-size="11.5" font-weight="500" fill-opacity="0.9">Join the beta on</text>
    <text x="65" y="43.5" font-size="21" font-weight="700" letter-spacing="-0.2">TestFlight</text>
  </g>
</svg>
